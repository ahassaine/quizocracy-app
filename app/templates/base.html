<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem('qz_theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>{% block title %}Quizocracy{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css?v=11">
</head>
<body>
<header class="top{% if ctx and (ctx.child or ctx.account.verified_at) %} signed{% endif %}">
  <a class="brand" href="/"><img src="/static/img/logo.png" alt=""><b class="wordmark">Quiz<span>ocracy</span></b></a>
  <nav class="links">
    {% if ctx and ctx.child %}
      <span class="who" data-testid="child-name">{{ ctx.child.name }}</span>
      <a href="/me">My day</a><a href="/board">Board</a><a href="/learn">Switch</a><a href="/parent-unlock">Parent</a>
    {% elif ctx and ctx.account.verified_at %}
      <a href="/home">Home</a><a href="/learn">Learn</a><a href="/board">Board</a><a href="/settings">Settings</a>
      <form method="post" action="/logout" style="display:inline"><button class="linkish" type="submit">Sign out</button></form>
    {% else %}
      <a href="/login">Sign in</a><a href="/signup">Sign up</a>
    {% endif %}
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch light or dark mode"></button>
  </nav>
</header>
<main class="wrap">{% block body %}{% endblock %}</main>
{% block foot %}<div class="foot"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></div>{% endblock %}
<script src="/static/js/ui.js?v=2"></script>
{% block scripts %}{% endblock %}
</body>
</html>
