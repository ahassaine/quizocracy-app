<div class="a11y" id="a11y" data-testid="a11y">
  <button class="a11y-btn" id="a11yBtn" type="button" aria-expanded="false" aria-controls="a11yPanel" aria-label="Text and display settings" title="Text and display settings" data-testid="a11y-open">Aa</button>
  <div class="a11y-panel" id="a11yPanel" role="group" aria-label="Text and display settings" hidden>
    <div class="a11y-ttl">Make it easier to read</div>
    <label class="check"><input type="checkbox" data-a11y="big" data-testid="a11y-big"> Bigger text</label>
    <label class="check"><input type="checkbox" data-a11y="dys" data-testid="a11y-dys"> Easy-to-read letters (good for dyslexia)</label>
    <label class="check"><input type="checkbox" data-a11y="space" data-testid="a11y-space"> More space between letters and lines</label>
    <label class="check"><input type="checkbox" data-a11y="calm" data-testid="a11y-calm"> Less movement (no stars or bouncing)</label>
    <label class="check"><input type="checkbox" data-a11y="contrast" data-testid="a11y-contrast"> Stronger colours</label>
    <p class="mut small" id="a11yNote" style="margin:6px 0 10px">These stay on this device.</p>
    <button class="btn" id="a11yDone" type="button">Done</button>
  </div>
</div>
<script>
/* Text and display settings, kept per device in localStorage (qz_a11y); base.html applies them before the page
   draws. "Less movement" starts ticked when the device asks for reduced motion, which always wins. */
(function () {
  const root = document.documentElement, btn = document.getElementById('a11yBtn'), panel = document.getElementById('a11yPanel');
  const osCalm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('qz_a11y') || '{}') || {}; } catch (e) {}
  panel.querySelectorAll('[data-a11y]').forEach(box => {
    const k = box.dataset.a11y;
    box.checked = saved[k] === true || (k === 'calm' && osCalm);
    if (k === 'calm' && osCalm) { box.disabled = true; document.getElementById('a11yNote').textContent = 'Less movement is on because this device asks for it. These stay on this device.'; }
    box.addEventListener('change', () => {
      saved[k] = box.checked; root.classList.toggle('a11y-' + k, box.checked);
      try { localStorage.setItem('qz_a11y', JSON.stringify(saved)); } catch (e) {}     // private mode: just for this page
    });
  });
  function show(open) { panel.hidden = !open; btn.setAttribute('aria-expanded', String(open)); }
  btn.addEventListener('click', () => show(panel.hidden));
  document.getElementById('a11yDone').addEventListener('click', () => { show(false); btn.focus(); });
  document.addEventListener('click', (e) => { if (!panel.hidden && !e.target.closest('#a11y')) show(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { show(false); btn.focus(); } });
})();
</script>
