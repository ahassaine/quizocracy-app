{% extends "base.html" %}{% block title %}New password · Quizocracy{% endblock %}
{% block body %}
<h1>Choose a new password</h1>
{% if invalid %}<div class="err" role="alert">This link has expired or was already used. <a href="/forgot">Ask for a new one</a>.</div>
{% else %}
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/reset" class="card">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
  <button class="btn primary" type="submit">Save password</button>
</form>
{% endif %}
{% endblock %}
