{% extends "base.html" %}{% block title %}Reset password · Quizocracy{% endblock %}
{% block body %}<div style="max-width:480px;margin:10px auto" class="rise"><div style="text-align:center"><img src="/static/img/logo.png" alt="" style="width:64px"></div>
<h1 style="text-align:center">Reset your password</h1>
{% if sent %}<div class="ok">If that email has an account, a reset link is on its way. It works for one hour.</div>{% endif %}
<form method="post" action="/forgot" class="card">
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
  <button class="btn primary" type="submit">Send reset link</button>
</form>
</div>{% endblock %}
