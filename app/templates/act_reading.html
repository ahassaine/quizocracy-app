{% extends "base.html" %}{% block title %}Reading · Quizocracy{% endblock %}
{% block body %}{% include "_drill_head.html" %}
<div class="read-wrap rise rise-3">
  <article class="card passage" id="passage" data-testid="passage" hidden aria-label="The passage to read">
    <div class="mut small passage-at" id="passageAt" data-testid="passage-at"></div>
    <div class="passage-body" id="passageBody" tabindex="0"></div>
  </article>
  <div class="stage" id="stage">
    <button class="btn to-passage" type="button" id="toPassage" data-testid="to-passage">📖 Back to the passage</button>
    <div class="mut small" id="skill"></div>
    <div class="bq" id="q" data-testid="question">…</div>
    <div id="area"></div>
    {% include "_drill_buttons.html" %}
  </div>
</div>{% endblock %}
{% block scripts %}<script src="/static/js/speak.js?v=6"></script><script src="/static/js/drill.js?v=32"></script><script src="/static/js/bank.js?v=12"></script><script>BankDrill('reading');</script>{% endblock %}
