{% extends "base.html" %}{% block title %}Verify your email · Quizocracy{% endblock %}
{% block body %}<div style="max-width:480px;margin:10px auto" class="rise"><div style="text-align:center"><img src="/static/img/logo.png" alt="" style="width:64px"></div>
<h1 style="text-align:center">Check your email</h1>
<p>We sent a 6-digit code to <b>{{ email }}</b>.</p>
{% if request.query_params.get('sent') %}<div class="ok">A new code is on its way.</div>{% endif %}
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/verify" class="card">
  <div class="field"><label for="code">Code</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></div>
  <button class="btn primary" type="submit">Verify</button>
</form>
<form method="post" action="/verify/resend"><button class="btn" type="submit">Send a new code</button></form>
</div>{% endblock %}
