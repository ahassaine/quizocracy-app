{# Link preview tags for a public page: what a search engine lists, and the card WhatsApp, Facebook or X shows
   when someone pastes the link. The picture (static/img/og-preview.png, 1200×630) is a real question screen. #}
{% macro meta(title, description, path) %}
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ cfg.PUBLIC_URL }}{{ path }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Quizocracy">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ cfg.PUBLIC_URL }}{{ path }}">
<meta property="og:image" content="{{ cfg.PUBLIC_URL }}/static/img/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quizocracy on a phone: a Year 3 pictogram question answered correctly">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ cfg.PUBLIC_URL }}/static/img/og-preview.png">
<meta name="twitter:image:alt" content="Quizocracy on a phone: a Year 3 pictogram question answered correctly">
{% endmacro %}
