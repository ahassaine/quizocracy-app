{% extends "base.html" %}{% block title %}Spelling · Quizocracy{% endblock %}
{% block body %}{% include "_drill_head.html" %}
<div class="stage rise rise-3" id="stage">
  <div class="row"><button class="btn big" id="play" type="button" data-speaks>Listen again</button><span class="mut" id="letters"></span></div>
  <div class="mut" id="cue" style="margin-top:10px;font-size:1.1rem"></div>
  <audio id="audio" preload="auto"></audio>
  <div style="margin-top:14px"><input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the word"></div>
  {% include "_drill_buttons.html" %}
</div>{% endblock %}
{% block scripts %}<script src="/static/js/speak.js?v=3"></script><script src="/static/js/drill.js?v=23"></script><script>
const audio = document.getElementById('audio');
let say = '';          // a school word with no recorded clip: the browser's own voice says it
function voice(text, rate) { return new Promise(res => { const s = window.speechSynthesis; if (!s || !window.SpeechSynthesisUtterance) return res();
  let t = 0; const done = () => { clearTimeout(t); res(); }; s.cancel(); const u = new SpeechSynthesisUtterance(text);
  const v = (s.getVoices() || []).find(x => /^en[-_]GB/i.test(x.lang)); u.lang = v ? v.lang : 'en-GB'; if (v) u.voice = v;
  u.rate = rate || 0.8; u.onend = u.onerror = done; t = setTimeout(done, 6000); s.speak(u); }); }
function sayWord() { return voice(say); }
// the word's clip; the promise ends when it has played (or could not play: no tap on the page yet)
function playWord() { if (say) return sayWord(); return new Promise(res => { let t = 0; const done = () => { clearTimeout(t); audio.removeEventListener('ended', done); res(); };
  audio.addEventListener('ended', done); t = setTimeout(done, 6000); audio.currentTime = 0; audio.play().catch(done); }); }
let playing = null;
document.getElementById('play').addEventListener('click', () => { if (say) { sayWord(); return; } audio.currentTime = 0; audio.play().catch(() => {}); });
Drill({ activity: 'spelling',
  render(q) { say = q.say ? [...atob(q.say)].reverse().join('') : '';
    // after a run of misses the server gives an easier word, with a kind word first (Years 1-2 hear it)
    const fb = document.getElementById('feedback');
    if (q.ease) { fb.className = 'feedback warn'; fb.textContent = q.ease; }
    const first = q.ease && window.Speak && Speak.young ? () => voice(q.ease, 0.9) : () => null;
    if (say) { audio.removeAttribute('src'); playing = new Promise(r => setTimeout(r, 0)).then(first).then(playWord); }   // after the 🔊 button resets the voice
    else { audio.src = q.audio; audio.load(); playing = q.ease ? new Promise(r => setTimeout(r, 0)).then(first).then(playWord) : playWord(); }
    document.getElementById('cue').textContent = q.cue ? 'Hint: ' + q.cue : '';
    document.getElementById('letters').textContent = q.letters + (q.letters === 1 ? ' letter' : ' letters');
    const a = document.getElementById('answer'); a.value = ''; a.focus(); },
  // 🔊: the word, then its hint sentence ("I walk ___ school." tells "to" from "two"); Years 1-2 hear the hint after the word by themselves
  speech(q) { return { parts: q.cue ? ['Hint: ' + q.cue] : [], lead: playWord, after: playing }; },
  read() { const v = document.getElementById('answer').value.trim(); return v ? { value: v } : null; },
  explain(r) { return r.other ? '' : 'It is spelt <b>' + esc(r.expected) + '</b>.'; },
  spoken(r) { return r.spoken || null; } });
</script>{% endblock %}
