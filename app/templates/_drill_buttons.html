<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
<div class="row"><button class="btn primary big" id="check" type="button">Check</button><button class="btn big" id="next" type="button" style="display:none">Next →</button></div>
{% if ctx and ctx.child %}<div class="report" id="report" data-testid="report">
  <button class="report-link" id="reportOpen" type="button" aria-expanded="false" aria-controls="reportBox" data-testid="report-open">Something wrong with this question?</button>
  <div class="report-box" id="reportBox" hidden>
    <div class="report-ttl">What is wrong?</div>
    <div class="report-why" role="radiogroup" aria-label="What is wrong?">
      <button class="opt" type="button" role="radio" aria-checked="false" data-reason="wrong">The answer is wrong</button>
      <button class="opt" type="button" role="radio" aria-checked="false" data-reason="unreadable">I can't read or see it</button>
      <button class="opt" type="button" role="radio" aria-checked="false" data-reason="nonsense">The question doesn't make sense</button>
      <button class="opt" type="button" role="radio" aria-checked="false" data-reason="other">Something else</button>
    </div>
    <label class="report-lbl" for="reportNote">Tell us more (you don't have to)</label>
    <textarea id="reportNote" rows="2" maxlength="500" spellcheck="true"></textarea>
    <div class="row"><button class="btn primary" id="reportSend" type="button" data-testid="report-send">Send</button><button class="btn" id="reportCancel" type="button">Cancel</button></div>
  </div>
  <div class="report-msg" id="reportMsg" role="status" aria-live="polite" data-testid="report-msg"></div>
</div>{% endif %}
