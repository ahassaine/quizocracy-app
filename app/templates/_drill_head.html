<div class="kid rise" id="drillHead" data-year="{{ ctx.child.year if ctx and ctx.child else '' }}"><div class="act-head"><img src="{{ act.img }}" alt=""><h1 style="margin:0">{{ act.title }}</h1></div><div class="head-btns">{% include "_a11y.html" %}<a class="btn" href="/me">My day</a></div></div>
<div class="daybar rise rise-2"><div class="mut small" style="font-weight:700"><span id="dayDone">0</span> of <span id="dayTarget">{{ act.target }}</span> right today <span id="dayExtra" class="day-extra" data-testid="day-extra" hidden></span> <span id="dayMsg"></span></div>
<div class="mut small" id="fixMsg" data-testid="fix-msg" style="font-weight:700"></div>
<div class="bar" id="dayBar" style="margin-top:6px"><i id="dayFill" style="width:0%"></i></div></div>
<div class="reward earned rise" id="dayReward" data-testid="reward-earned" hidden><img src="/static/img/trophy.png" alt=""><span></span></div>
