{% extends "base.html" %}{% block title %}Sign up · Quizocracy{% endblock %}
{% block body %}<div style="max-width:480px;margin:10px auto" class="rise"><div style="text-align:center"><img src="/static/img/logo.png" alt="" style="width:84px;animation:bob 5s ease-in-out infinite"></div>
<h1 style="text-align:center">Create a parent account</h1>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/signup" class="card">
  <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}"></div>
  <div class="field"><label for="password">Password (8 characters or more)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
  <div class="field"><label for="family_name">Family name <span class="mut">(optional)</span></label><input id="family_name" name="family_name" type="text" value="{{ family_name or '' }}"></div>
  {% if need_invite %}<div class="field"><label for="invite">Invitation code</label><input id="invite" name="invite" type="text" required></div>{% endif %}
  <div class="field check"><input id="consent" name="consent" type="checkbox" value="1"><label for="consent" style="font-weight:400">I am a parent or guardian aged 18 or over, and I accept the <a href="/terms">terms</a> and <a href="/privacy">privacy notice</a>.</label></div>
  <button class="btn primary big" type="submit">Create account</button>
</form>
<p class="mut">Already have an account? <a href="/login">Sign in</a></p>
</div>{% endblock %}
